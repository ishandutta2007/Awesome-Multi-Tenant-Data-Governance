<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.15;0.35" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .grid-line {
        stroke: #1e293b;
        stroke-width: 1;
        opacity: 0.6;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="600" cy="180" r="340" fill="url(#glowPulse)" />
  <circle cx="200" cy="100" r="280" fill="url(#cyanGlow)" />

  <!-- Dynamic Animated Tech Background Grid & Particles -->
  <g opacity="0.4">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />

    <!-- Vertical Grid Lines -->
    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Dynamic Data Packet Flows (Constrained to background edges so title remains crystal clear) -->
  <g>
    <!-- Left Data Flow Circuit -->
    <path d="M 50 180 L 150 180 L 220 120 L 300 120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6" />
    <circle r="4" fill="#38bdf8">
      <animateMotion path="M 50 180 L 150 180 L 220 120 L 300 120" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Right Data Flow Circuit -->
    <path d="M 900 240 L 980 240 L 1050 180 L 1150 180" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6" />
    <circle r="4" fill="#c084fc">
      <animateMotion path="M 900 240 L 980 240 L 1050 180 L 1150 180" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" />
    </circle>

    <!-- Top Floating Nodes -->
    <circle cx="1020" cy="80" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="r" values="18;21;18" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="80" r="6" fill="#38bdf8" />

    <circle cx="150" cy="280" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5">
      <animate attributeName="r" values="16;19;16" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="280" r="5" fill="#818cf8" />
  </g>

  <!-- Foreground Content Block (High contrast, clearly visible) -->
  <!-- Category Pill Badge -->
  <g transform="translate(600, 78)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" filter="url(#shadow)" />
    <circle cx="-135" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-120" y="5" class="tag-text">ENTERPRISE SECURITY &amp; COMPLIANCE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" class="title-text" filter="url(#shadow)">
    Awesome Multi-Tenant Data Governance
  </text>

  <!-- Accent Gradient Underline -->
  <rect x="420" y="185" width="360" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text x="600" y="228" text-anchor="middle" class="subtitle-text">
    Curated SaaS Platforms &amp; Open-Source Tools for Tenant Isolation &amp; Policy Control
  </text>

  <!-- Feature Tags / Capabilities -->
  <g transform="translate(600, 280)">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">🛡️ Tenant Isolation</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-160, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">🔐 RBAC / ABAC</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">📊 Data Lineage</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(160, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">🔍 Audit &amp; Masking</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">📜 Open-Source</text>
    </g>
  </g>
</svg>
